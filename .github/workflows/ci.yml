name: ci

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_assessment_platform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d ai_assessment_platform_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package.json }
      - run: cd backend && npm install
      - run: cd backend && npm run prisma:generate
      - run: cd backend && npm run build
      - run: cd backend && npm test
      - run: cd backend && npm audit --audit-level=high
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package.json }
      - run: cd frontend && npm install
      - run: cd frontend && npm test
      - run: cd frontend && npm run build
      - run: cd frontend && npm audit --audit-level=high
